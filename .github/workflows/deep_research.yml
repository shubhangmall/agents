name: deep_research CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  deep-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r deep_research/requirements.txt

      - name: Check PR diff
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Run unit tests
        working-directory: deep_research
        run: python -m unittest test_deep_research test_timeline

      - name: Compile Python sources
        run: python -m compileall -q deep_research
